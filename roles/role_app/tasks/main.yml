---
- name: Deploy application with error handling
  block:
    - name: Install python3 and pip
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Install flask
      pip:
        name: flask
        state: present

    - name: Create app directory
      file:
        path: /opt/myapp
        state: directory
        mode: '0755'

    - name: Copy application code
      copy:
        src: app.py
        dest: /opt/myapp/app.py
        mode: '0755'

    - name: Create systemd service
      template:
        src: myapp.service.j2
        dest: /etc/systemd/system/myapp.service
      notify: restart myapp

    - name: Start and enable myapp service
      systemd:
        name: myapp
        state: started
        enabled: yes

  rescue:
    - name: Handle application deployment error
      debug:
        msg: "Application deployment failed! Check logs."

    - name: Stop myapp service if running
      systemd:
        name: myapp
        state: stopped
      ignore_errors: yes

  always:
    - name: Ensure systemd daemon reload
      systemd:
        daemon_reload: yes
