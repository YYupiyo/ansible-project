---
- name: Install python3 and pip
  apt:
    name:
      - python3
      - python3-pip
      - python3-psycopg2
    state: present

- name: Install flask and postgres driver
  pip:
    name:
      - flask
      - psycopg2-binary
    state: present

- name: Wait for database to be ready
  wait_for:
    host: "{{ db_host }}"
    port: 5432
    timeout: 60
    delay: 5

- name: Create app directory
  file:
    path: /opt/myapp
    state: directory
    mode: '0755'

- name: Copy application code
  copy:
    src: app.py
    dest: /opt/myapp/app.py
    mode: '0755'

- name: Copy database config
  template:
    src: db_config.py.j2
    dest: /opt/myapp/db_config.py
    mode: '0644'

- name: Create systemd service
  template:
    src: myapp.service.j2
    dest: /etc/systemd/system/myapp.service
  notify: restart myapp

- name: Start and enable myapp service
  systemd:
    name: myapp
    state: started
    enabled: yes
