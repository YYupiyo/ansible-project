name: Validate Ansible Syntax

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: sudo apt update && sudo apt install ansible -y
      - name: Check syntax
        run: ansible-playbook --syntax-check playbooks/validate.yml
